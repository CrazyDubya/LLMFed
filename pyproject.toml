[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmfed"
version = "0.1.0"
description = "AI-powered wrestling federation simulator with LLM agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg2-binary",
    "pydantic>=2.0,<3",
    "python-dotenv",
    "httpx",
    "openai",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "python-multipart",
    "slowapi",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio",
    "pytest-cov",
    "flake8",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api_gateway", "agent_service", "core_engine", "llm_abstraction", "models"]
