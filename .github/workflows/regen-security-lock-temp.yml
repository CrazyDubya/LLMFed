name: Regenerate security lockfile (temporary)

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read

jobs:
  regenerate:
    if: github.event.issue.pull_request && github.event.issue.number == 23 && github.event.comment.body == '/regen-security-lock'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dependabot/security-bumps
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm install --ignore-scripts
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate web-ui package lock"
          git push origin HEAD:dependabot/security-bumps
