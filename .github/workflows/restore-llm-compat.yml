name: Restore LLM compatibility

on:
  push:
    branches: [lint-cleanup]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: lint-cleanup
          fetch-depth: 0

      - name: Restore intended provider surface and compatibility
        run: |
          git show d626c0a27d489afa52ed3250a53f169dba73565a:llm_abstraction/provider.py > llm_abstraction/provider.py
          python .github/scripts/restore_llm_compat.py

      - name: Lint and compile
        run: |
          python -m pip install ruff flake8
          ruff format llm_abstraction/provider.py core_engine/engine.py api_gateway/main.py api_gateway/routes/core_routes.py
          python -m compileall -q api_gateway agent_service core_engine game_service llm_abstraction models tests
          flake8 . --count --show-source --statistics

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip 'setuptools>=83.0.0'
          python -m pip install -r requirements.txt
          python -m pip install -e '.[dev]'

      - name: Validate LLM, security, and RBAC
        run: pytest -q tests/test_llm_abstraction.py tests/test_security.py tests/test_rbac.py

      - name: Commit repair and remove helpers
        run: |
          rm .github/workflows/restore-llm-compat.yml .github/scripts/restore_llm_compat.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore LLM provider compatibility and lazy engine init"
          git push origin HEAD:lint-cleanup
