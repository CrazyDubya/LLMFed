name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip 'setuptools>=83.0.0'
          python -m pip install -r requirements.txt
          python -m pip install -e '.[dev]' pip-audit

      - name: Audit Python dependencies
        run: pip-audit

      - name: Lint with flake8
        run: flake8 . --count --show-source --statistics

      - name: Run tests
        env:
          DATABASE_URL: 'sqlite:///./test_ci.db'
          OPENAI_API_KEY: 'sk-test-not-real'
          OPENAI_API_BASE: 'http://127.0.0.1:11434/v1'
          OPENAI_MODEL: 'long-gemma'
        run: python -m pytest tests/ -v --tb=short -q

  web-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Install web UI dependencies
        working-directory: web-ui
        run: npm ci

      - name: Audit web UI dependencies
        working-directory: web-ui
        run: npm audit --audit-level=high

      - name: Lint web UI
        working-directory: web-ui
        run: npm run lint

      - name: Build web UI
        working-directory: web-ui
        run: npm run build
