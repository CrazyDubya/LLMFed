name: Python lint cleanup

on:
  push:
    branches: [lint-cleanup]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: lint-cleanup

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Apply mechanical formatting and safe lint fixes
        run: |
          python -m pip install ruff
          ruff format .
          ruff check . --fix --select F401,F541,E204,E303,E306,E741
          rm .github/workflows/lint-cleanup.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: normalize Python formatting and imports"
          git push origin HEAD:lint-cleanup

      - name: Report residual flake8 findings
        continue-on-error: true
        run: |
          python -m pip install flake8
          flake8 . --count --show-source --statistics

      - name: Smoke-test Python suite
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip 'setuptools>=83.0.0'
          python -m pip install -r requirements.txt
          python -m pip install -e '.[dev]'
          pytest -q
