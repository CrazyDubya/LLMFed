name: Finalize Python cleanup

on:
  push:
    branches: [lint-cleanup]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: lint-cleanup

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Repair latent async/DI defects exposed by lint
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=-1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old!r}")
              p.write_text(text.replace(old, new, count))

          # A route already used await but was accidentally declared as sync.
          replace(
              "api_gateway/routes/core_routes.py",
              "\ndef list_agents_in_federation_endpoint(",
              "\nasync def list_agents_in_federation_endpoint(",
              1,
          )
          # Use the repository's existing dependency hook instead of undefined globals.
          replace(
              "api_gateway/routes/core_routes.py",
              "async def engine_debug():",
              "async def engine_debug(engine=Depends(get_engine_dependency)):",
              1,
          )
          replace(
              "api_gateway/routes/core_routes.py",
              "async def prompter_hints(request: PrompterHintRequest):",
              "async def prompter_hints(\n    request: PrompterHintRequest, engine=Depends(get_engine_dependency)\n):",
              1,
          )

          # Metrics use the same injected LLM object as the rest of the API.
          replace(
              "api_gateway/routes/metrics_routes.py",
              "from fastapi import APIRouter",
              "from fastapi import APIRouter, Depends\n\nfrom api_gateway.dependencies import get_llm_dependency",
              1,
          )
          replace(
              "api_gateway/routes/metrics_routes.py",
              "async def get_metrics() -> Dict[str, Any]:",
              "async def get_metrics(llm=Depends(get_llm_dependency)) -> Dict[str, Any]:",
              1,
          )
          replace(
              "api_gateway/routes/metrics_routes.py",
              "        llm = get_llm()\n        metrics[\"llm_budget\"]",
              "        metrics[\"llm_budget\"]",
              1,
          )
          replace(
              "api_gateway/routes/metrics_routes.py",
              "async def llm_health() -> Dict[str, Any]:",
              "async def llm_health(llm=Depends(get_llm_dependency)) -> Dict[str, Any]:",
              1,
          )
          replace(
              "api_gateway/routes/metrics_routes.py",
              "        llm = get_llm()\n        result[\"provider\"]",
              "        result[\"provider\"]",
              1,
          )

          # The core engine is intentionally still synchronous internally; restore the
          # matching compatibility session and load AgentDB directly rather than calling
          # an async CRUD function without awaiting it.
          replace(
              "core_engine/engine.py",
              "from models.db_models import EngineRequestDB, NarrativeLogDB",
              "from models.db_models import AgentDB, EngineRequestDB, NarrativeLogDB",
              1,
          )
          replace(
              "core_engine/engine.py",
              "from agent_service.crud import get_agents",
              "from llm_abstraction.provider import get_llm",
              1,
          )
          replace(
              "core_engine/engine.py",
              "        agents = get_agents(db)",
              "        agents = db.query(AgentDB).all()",
              1,
          )

          # Initialize the dependencies that api_gateway.dependencies reads from app.state.
          p = Path("api_gateway/main.py")
          text = p.read_text()
          anchor = "from api_gateway.websocket_hub import websocket_endpoint, start_reaper\n"
          injected = (
              anchor
              + "from agent_service.database import init_db\n"
              + "from core_engine.engine import get_engine\n"
              + "from llm_abstraction.provider import get_llm\n"
          )
          if "from core_engine.engine import get_engine" not in text:
              if anchor not in text:
                  raise SystemExit("main.py import anchor not found")
              text = text.replace(anchor, injected, 1)
          startup_anchor = "async def _on_startup():\n    start_reaper()\n"
          startup_new = (
              "async def _on_startup():\n"
              "    init_db()\n"
              "    app.state.llm = get_llm()\n"
              "    app.state.engine = get_engine()\n"
              "    start_reaper()\n"
          )
          if startup_anchor not in text:
              raise SystemExit("main.py startup anchor not found")
          p.write_text(text.replace(startup_anchor, startup_new, 1))
          PY

      - name: Finish mechanical lint cleanup
        run: |
          python -m pip install ruff flake8
          ruff check . --fix --unsafe-fixes --select F401,F841,E741
          ruff format .
          rm .github/workflows/finalize-python-cleanup.yml
          python -m compileall -q api_gateway agent_service core_engine game_service llm_abstraction models tests
          flake8 . --count --show-source --statistics

      - name: Commit validated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve Python lint debt and latent DI defects"
          git push origin HEAD:lint-cleanup

      - name: Run focused security tests
        run: |
          python -m pip install --upgrade pip 'setuptools>=83.0.0'
          python -m pip install -r requirements.txt
          python -m pip install -e '.[dev]'
          pytest -q tests/test_security.py tests/test_rbac.py

      - name: Report full suite state
        continue-on-error: true
        run: pytest -q
