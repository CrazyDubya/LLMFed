name: Remediate web dependencies

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Apply non-breaking npm audit fixes and validate
        working-directory: web-ui
        run: |
          npm ci
          npm audit fix
          npm audit --audit-level=high
          npm run lint
          npm run build

      - name: Commit validated remediation and remove this workflow
        run: |
          rm .github/workflows/remediate-web-deps.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/remediate-web-deps.yml web-ui/package.json web-ui/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git commit -m "fix(deps): remediate web UI audit findings"
          git push origin HEAD:master
